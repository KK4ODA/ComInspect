[package]
name = "cominspect"
description = "ComInspect - serial port inventory and identity manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
default-run = "cominspect"

[lib]
name = "cominspect_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cominspect-core.workspace = true
cominspect-store.workspace = true
cominspect-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-log = "2.9"
tauri-plugin-process = "2.3"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.12"
tauri-plugin-single-instance = "2.4"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
