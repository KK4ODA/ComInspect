[package]
name = "cominspect-platform"
description = "Operating-system serial port discovery, monitoring and diagnostics for ComInspect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cominspect-core.workspace = true
log.workspace = true
serde.workspace = true
thiserror.workspace = true
serialport.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Devices_SerialCommunication",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    # Port usage (which process has a port open) and launching programs
    "Wdk_Foundation",
    "Wdk_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_Devices_Communication",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
io-kit-sys = "0.5"

[dev-dependencies]
tempfile.workspace = true
